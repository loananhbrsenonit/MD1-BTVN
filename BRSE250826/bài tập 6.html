<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>
<body>
  <h1>Format text <mark>marked</mark></h1>
  <p>Please you only HTML without CSS.</p>
  <ul>
    <li><b>This word is <i>imphasized</i></b></li>
    <li><b>This word is <i>italic</i></b></li>
    <li><b>This word is <sup>superscripted</sup></b></li>
    <li><b>This word is <sub>subscripted</sub></b></li>
    <li><b>This word is <ins>inserted</ins></b></li>
    <li><b>This word is <del>deleted</del></b></li>
  </ul>
</body>
</html>
